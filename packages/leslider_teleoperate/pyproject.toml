[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leslider_teleoperate"
version = "0.1.0"
description = "LeSlider teleop CLI: lerobot-teleoperate fork that logs teleop cameras in Rerun when display_data is enabled."
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]>=0.5.1",
]

[project.scripts]
leslider-teleoperate = "leslider_teleoperate.main:main"

[tool.setuptools.packages.find]
where = ["src"]
