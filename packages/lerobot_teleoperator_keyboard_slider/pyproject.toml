[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_keyboard_slider"
version = "0.1.0"
description = "LeRobot leader plugin: keyboard arrow-key teleop that drives a slider motor by emitting velocity commands."
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.5.1",
    "pynput>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
