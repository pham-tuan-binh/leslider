[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_so101_with_slider"
version = "0.1.0"
description = "LeRobot leader plugin: SO-101 leader mirrors the follower arm (including base); arrow keys drive the slider; optional teleop cameras for leslider-teleoperate."
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]>=0.6",
    "pynput>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
