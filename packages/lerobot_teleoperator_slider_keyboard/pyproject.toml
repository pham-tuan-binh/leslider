[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_slider_keyboard"
version = "0.1.0"
description = "LeRobot leader plugin: arrow-key keyboard teleop that emits velocity commands for a slider motor."
requires-python = ">=3.10"
dependencies = [
    "lerobot",
    "pynput>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
