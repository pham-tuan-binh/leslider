[project]
name = "leslider"
version = "0.1.0"
description = "SO-101 on a slider, for LeRobot. Workspace plugins driving one rig."
requires-python = ">=3.12"
dependencies = [
    "lerobot",
    "lerobot_robot_so101_slider",
    "lerobot_teleoperator_so101_with_slider",
    "leslider_teleoperate",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lerobot_robot_so101_slider = { workspace = true }
lerobot_teleoperator_so101_with_slider = { workspace = true }
leslider_teleoperate = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Meta-distribution: no Python modules at repo root; code lives under packages/*.
[tool.setuptools]
packages = []
