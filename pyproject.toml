[project]
name = "leslider"
version = "0.1.0"
description = "SO-101 on a slider, for LeRobot. Workspace plugins driving one rig."
requires-python = ">=3.12"
dependencies = [
    "lerobot",
    "lerobot_robot_so101_slider",
    "lerobot_robot_so101_slider_pos",
    "lerobot_teleoperator_so101_with_slider",
    "lerobot_teleoperator_so101_with_slider_pos",
    "leslider_teleoperate",
]

[tool.uv.workspace]
# Explicit members so stray dirs under packages/ (e.g. old clones) never break uv sync.
members = [
    "packages/lerobot_robot_so101_slider",
    "packages/lerobot_robot_so101_slider_pos",
    "packages/lerobot_teleoperator_so101_with_slider",
    "packages/lerobot_teleoperator_so101_with_slider_pos",
    "packages/leslider_teleoperate",
]

[tool.uv.sources]
lerobot_robot_so101_slider = { workspace = true }
lerobot_robot_so101_slider_pos = { workspace = true }
lerobot_teleoperator_so101_with_slider = { workspace = true }
lerobot_teleoperator_so101_with_slider_pos = { workspace = true }
leslider_teleoperate = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Meta-distribution: no Python modules at repo root; plugins live under packages/<name>/.
[tool.setuptools]
packages = []
