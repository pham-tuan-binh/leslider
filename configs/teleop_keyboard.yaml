# Slider only, arrow keys.
# Run with:  uv run lerobot-teleoperate --config_path=configs/teleop_keyboard.yaml
#
# Edit `port` and `id` to match your rig the first time, then keep using
# this file. Override at the CLI for one-offs:
#   uv run lerobot-teleoperate --config_path=configs/teleop_keyboard.yaml --robot.port=/dev/tty.usbmodemX

robot:
  type: so101_slider_follower
  port: /dev/tty.usbmodemFOLLOWER
  id: my_arm
  slider_id: 7
  slider_max_velocity: 3000

teleop:
  type: keyboard_slider_leader
  id: slider_kb
  cruise_velocity: 1500
  speed_increment: 250
  min_velocity: 100
  max_velocity: 3000
  invert_direction: false

display_data: false
